# Load balancer in front of the gateway instances (M5, docker-compose.m5.yml). NOT FOR PRODUCTION.
#   :8080  public listener (http): the proxy and mcp-e2e talk to it as gateway-lb:8080 / localhost:GATEWAY_PORT
#   :8443  internal listener (mTLS): TCP passthrough, so client certificates, JWKS C2 and the admin API reach the instance untouched
#   :8404  /__lb/health and /__lb/status (stub_status), for the container health check and for tests
# Instances are found through the alias gateway-backends.internal (every running instance has it; a stopped one is
# gone from Docker DNS), resolved again every second. nginx has no active health checks: a dead address is skipped when a
# connect fails, which is retried on the next address. A request that already reached an instance is NOT retried (POST), so
# killing an instance during a call gives that call an error; the client repeats it.

worker_processes auto;
# The error log names the failing request including its query (the /mcp filter: system and tool names, no secrets or codes).
error_log /dev/stderr error;
pid /tmp/nginx.pid;

events { worker_connections 8192; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  resolver 127.0.0.11 valid=1s ipv6=off;
  # $uri has no query string: filters and authorization codes stay out of the log.
  log_format lb '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent upstream=$upstream_addr rid=$http_x_request_id';
  access_log /dev/stdout lb;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 4m;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 16k;

    # The balancer's own errors are JSON in the shape of the gateway's (clients and the proxy in front never get nginx HTML).
    error_page 400 /__lb_err/400;
    error_page 413 /__lb_err/413;
    error_page 414 /__lb_err/414;
    error_page 431 /__lb_err/431;
    error_page 494 =431 /__lb_err/431;
    error_page 502 /__lb_err/502;
    error_page 503 /__lb_err/503;
    error_page 504 /__lb_err/504;
    location = /__lb_err/400 { internal; default_type application/json; return 400 '{"error":"invalid_request"}'; }
    location = /__lb_err/413 { internal; default_type application/json; return 413 '{"error":"invalid_request"}'; }
    location = /__lb_err/414 { internal; default_type application/json; return 414 '{"error":"invalid_request"}'; }
    location = /__lb_err/431 { internal; default_type application/json; return 431 '{"error":"invalid_request"}'; }
    # 502 and 504 are the BalancerError of mcp-contracts 6.2.0: a fixed text that neither claims the request was done nor that it was
    # not, because a request that already reached an instance is never repeated (proxy_next_upstream does not list the non-idempotent option).
    location = /__lb_err/502 {
      internal;
      default_type "application/json; charset=utf-8";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      return 502 '{"error":"bad_gateway","message":"The request may or may not have been processed. Check the result before repeating a write."}';
    }
    location = /__lb_err/503 { internal; default_type application/json; return 503 '{"error":"upstream_unavailable"}'; }
    location = /__lb_err/504 {
      internal;
      default_type "application/json; charset=utf-8";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      return 504 '{"error":"gateway_timeout","message":"The request may or may not have been processed. Check the result before repeating a write."}';
    }

    location / {
      set $backends gateway-backends.internal;
      # No URI part: the request line (path and query) goes to the instance as the client sent it.
      proxy_pass http://$backends:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
      # Errors of the instance (its own JSON) pass as they are; only the balancer's errors above are rewritten.
      proxy_intercept_errors off;
      # MCP responses can be event streams.
      proxy_buffering off;
      proxy_cache off;
      # Event streams (GET of a session, subscriptions/listen) carry a heartbeat every 15 s, so 120 s is a safe read timeout. An instance that
      # stays silent before it sent any header ends as a 504 (BalancerError) after two minutes; on a stream that already started nginx just closes
      # the connection after 120 s of silence (no page can be sent any more).
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }

  server {
    listen 8404;
    server_name _;
    location = /__lb/health { default_type text/plain; return 200 "ok\n"; }
    location = /__lb/status { stub_status; }
  }
}

stream {
  resolver 127.0.0.11 valid=1s ipv6=off;
  log_format lbtcp '$remote_addr -> $upstream_addr status=$status sent=$bytes_sent received=$bytes_received';
  access_log /dev/stdout lbtcp;

  server {
    listen 8443;
    set $backends gateway-backends.internal:8443;
    proxy_pass $backends;
    proxy_connect_timeout 2s;
    proxy_next_upstream_tries 3;
    proxy_timeout 3600s;
  }
}
