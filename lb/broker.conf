# Load balancer in front of the broker instances (M5, docker-compose.m5.yml). NOT FOR PRODUCTION.
#   :8443  mTLS, TCP passthrough: the client certificate (CN mcp-gateway, mcp-portal-bff, mcp-offboarding) reaches the broker
#   :8404  /__lb/health and /__lb/status
# Instances are found through broker-backends.internal; see lb/gateway.conf for the failure behaviour.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8404;
    server_name _;
    location = /__lb/health { default_type text/plain; return 200 "ok\n"; }
    location = /__lb/status { stub_status; }
  }
}

stream {
  resolver 127.0.0.11 valid=1s ipv6=off;
  log_format lbtcp '$remote_addr -> $upstream_addr status=$status sent=$bytes_sent received=$bytes_received';
  access_log /dev/stdout lbtcp;

  server {
    listen 8443;
    set $backends broker-backends.internal:8443;
    proxy_pass $backends;
    proxy_connect_timeout 2s;
    proxy_next_upstream_tries 3;
    proxy_timeout 600s;
  }
}
