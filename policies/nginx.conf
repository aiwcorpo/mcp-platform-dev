# Policy bundle server (C7, CC-026): read-only static files in the layout ws-09 publishes,
#   /policies/<main|overrides>/latest.json, policies-<revision>.tar.gz, policies-<revision>.tar.gz.sig
# Receivers (gateway, starters) pull from here and verify the signature themselves; this server is not a trust anchor.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  access_log off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  server {
    listen 8080;
    root /srv;
    etag on;
    autoindex off;
    # The publisher keeps .publish.lock next to latest.json; nothing starting with a dot is served.
    location ~ /\. { return 404; }
    # A stale latest.json would delay a revision (and the emergency channel) by a cache lifetime.
    location ~ ^/policies/(main|overrides)/latest\.json$ {
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      default_type application/json;
    }
    location ~ "^/policies/(main|overrides)/policies-[0-9]{14}-[0-9a-f]{7}\.tar\.gz(\.sig)?$" {
      limit_except GET HEAD { deny all; }
      # Revisions are immutable, a re-publication of the same revision is refused by the publisher.
      add_header Cache-Control "public, max-age=3600, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      default_type application/octet-stream;
    }
    location = /__health { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
  }
}
