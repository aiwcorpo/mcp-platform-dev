# Policy bundle server (C7): read-only static files in the layout the policies repo publishes,
#   /policies/<main|overrides>/latest.json, policies-<revision>.tar.gz, policies-<revision>.tar.gz.sig
# Receivers (gateway, starters) pull from here and verify the signature themselves; this server is not a trust anchor.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  # M5 layer: the download of a bundle is the trace X13 of mcp-e2e looks for (revision in the path; the client address is the container network).
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  server {
    listen 8080;
    root /srv;
    etag on;
    autoindex off;
    include /etc/nginx/policies-locations.conf;
  }
  # Servers built on the starter accept a bundle address only over https (outside the dev profile).
  server {
    listen 8443 ssl;
    root /srv;
    etag on;
    autoindex off;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/policies-locations.conf;
  }
}
