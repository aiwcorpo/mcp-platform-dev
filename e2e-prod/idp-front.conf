# Profile e2e-prod: the key set of the realm over https, which a gateway outside the devstack profile insists on (Keycloak
# answers https only for the name localhost). Only the JWKS path is passed on; tokens are still issued by the stack's Keycloak.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /realms/corp/protocol/openid-connect/certs {
      limit_except GET { deny all; }
      proxy_pass http://keycloak:8080;
      proxy_set_header Host keycloak:8080;
    }
    location = /__health { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
  }
}
