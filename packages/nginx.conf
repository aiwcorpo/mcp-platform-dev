# Package server of the dev stack (M5): artifacts of builds and CI as plain files over http, read-only. NOT FOR PRODUCTION.
# Layout under /srv/packages (host: ARTIFACTS_DIR/packages): maven/ for a Maven repository layout, files/ for tarballs.
# Publishing is a file copy on the host (scripts/publish-package.sh), never an HTTP write.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /srv/packages;
    add_header X-Content-Type-Options nosniff always;

    location = /__health { default_type text/plain; return 200 "ok\n"; }
    location ~ /\. { return 404; }
    location / {
      limit_except GET HEAD { deny all; }
      autoindex on;
      try_files $uri $uri/ =404;
    }
  }
}
