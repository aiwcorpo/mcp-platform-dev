# Profile bulk (optional, added by scripts/bulk.sh for the time of a test, never by default): a stand-in with 250 READ_ONLY tools for
# scenario G9 (paging of tools/list, 100 per page). NOT FOR PRODUCTION. The contracts know five systems and the gateway refuses another,
# so the stand-in takes the identity of mcp-confluence (server id, address, system) while the real mcp-confluence is removed;
# scripts/bulk.sh does the swap and its way back. Group of the test user: mcp-confluence-read (rule confluence-call-read of the
# bundle), tools appear as confluence__read_item_001 .. confluence__read_item_250. The four real tools stay in the manifest exactly as
# built (hashes included), so their approvals in the registry survive both ways; while the stand-in runs they answer with an error (isError).
services:
  mcp-bulk:
    profiles: [bulk]
    image: python:3.12-alpine@sha256:0687a6bc9716edc2a6ee0fbfb0f87e7ee358b262b67c9215de91bc9b2d38ba71
    pull_policy: never
    command: ["python3", "/app/mcp_stub.py", "serve"]
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MCP_STUB_TOOLSET: bulk
      MCP_STUB_TOOL_COUNT: "250"
      MCP_STUB_BASE_MANIFEST: /base/mcp-manifest.json
      MCP_STUB_CERT: /certs/tls.crt
      MCP_STUB_KEY: /certs/tls.key
      MCP_STUB_CA: /certs/ca.crt
      MCP_GATEWAY_JWKS_URI: https://${MCP_GATEWAY_INTERNAL_TLS_NAME}:8443/.well-known/jwks.json
      MCP_GATEWAY_ISSUER: https://mcp-gateway.internal
    volumes:
      - ./mocks/mcp:/app:ro
      - ./certs/mcp-bulk/tls.crt:/certs/tls.crt:ro
      - ./certs/mcp-bulk/tls.key:/certs/tls.key:ro
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
      # The build artifact of the real server: its four tools stay in the manifest, unchanged (so their approvals stay), next to the 250.
      - type: bind
        source: ../mcp-server-confluence/mcp-app/target/mcp-manifest.json
        target: /base/mcp-manifest.json
        read_only: true
        bind: {create_host_path: false}
    networks:
      servers:
        aliases: [mcp-confluence.internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8443), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
