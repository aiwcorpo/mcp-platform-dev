# Thin wrapper: all logic is in ci/run.sh. Image of ci/Dockerfile (build it on the runner or push it and change the name).
# No secrets are referenced and the token is read-only. The Docker socket is given to pushes to main only; pull requests
# run the static job alone.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcp-ci:local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ci/run.sh lint mocks compose style

  docker-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: mcp-ci:local
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      CI_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ci/run.sh unit proxy lb start
