# Dev only. The portal BFF runs in this container's network namespace and discovers its IdP at the issuer address
# http://localhost:18080 (the iss of every token). Inside a container that is the container itself, so this
# relay answers there and forwards to Keycloak; Keycloak (KC_HOSTNAME_BACKCHANNEL_DYNAMIC) then returns
# token and JWKS endpoints under the same host, which the relay serves as well.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 127.0.0.1:18080;
    location / {
      set $keycloak keycloak:8080;
      proxy_pass http://$keycloak;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
    }
  }
}
