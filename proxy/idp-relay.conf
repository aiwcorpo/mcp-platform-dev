# Dev only. The portal BFF runs in this container's network namespace and discovers its IdP at the public
# address of Keycloak, https://localhost:KEYCLOAK_TLS_PORT (the iss of every token). Inside a container that is the
# container itself, so this relay answers there (certificate from the "dev public" CA, which the BFF trusts through
# its JVM truststore) and forwards to Keycloak over https with the same Host: Keycloak (KC_HOSTNAME_BACKCHANNEL_DYNAMIC)
# then returns token and JWKS endpoints under the same https address, which the relay serves as well.
# The listen directive comes from /tmp/relay-listen.conf (written from KEYCLOAK_TLS_PORT by the container command).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    include /tmp/relay-listen.conf;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      set $keycloak keycloak:8443;
      proxy_pass https://$keycloak;
      proxy_ssl_server_name on;
      proxy_ssl_name localhost;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
    }
  }
}
