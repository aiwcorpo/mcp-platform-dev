proxy_http_version 1.1;
proxy_set_header Connection "";
# Host and the forwarded headers describe the public origin, never what the client wrote: upstreams build
# addresses from them (BFF forward-headers-strategy native).
proxy_set_header Host $public_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $public_host;
proxy_set_header X-Forwarded-Port $public_port;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_redirect off;
