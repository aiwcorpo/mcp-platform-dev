# One origin for portal and gateway (mcp-contracts README "Jedna domena", CC-089). NOT FOR PRODUCTION.
#   /                                       -> portal-web  (static SPA, fallback to index.html)
#   /api                                    -> portal-bff
#   /s/, /v/, /.well-known/oauth-protected-resource*  -> mcp-gateway, public listener (8080) only
# The gateway's C5 admin API and JWKS live on its own mTLS listener (8443); this file has no route to it.
# Upstream names are resolved per request, so the proxy starts and survives restarts of any upstream.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Query strings carry authorization codes (OIDC and OAuth callbacks), so the log has the path only.
  log_format callbacks_safe '$remote_addr "$request_method $raw_path $server_protocol" $status $body_bytes_sent '
                            'rid=$http_x_request_id';
  access_log /dev/stdout callbacks_safe;
  # $public_host and $public_port (generated from PROXY_PORT by the container command, see docker-compose.yml).
  include /tmp/public-origin.conf;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $request_uri $raw_path { ~^(?<p>[^?]*) $p; default $request_uri; }

  # Anything but a plain canonical path is refused instead of forwarded: encoded dots, slashes, backslashes and
  # percent signs, dot segments, doubled slashes. nginx forwards the request line as sent by the client when
  # proxy_pass has no URI part, so normalizing means rejecting what is not already normal.
  map $raw_path $noncanonical_path {
    ~*%(2e|2f|3b|5c|25|00) 1;
    ~\x5c 1;
    "~;" 1;
    ~(^|/)\.\.?(/|$) 1;
    ~// 1;
    default 0;
  }

  # Gateway routes carry slugs and server ids only: a percent sign there is never legitimate (nginx would decode
  # /%73/x to /s/x and hand the raw form to the gateway).
  map $uri $gateway_uri {
    ~^/(s|v)/ 1;
    ~^/\.well-known/oauth-protected-resource(/|$) 1;
    default 0;
  }
  map $raw_path $percent_in_path { ~% 1; default 0; }

  # The internal redirect to /_err/... runs the server rewrite phase again; the refusal must not fire a second
  # time, or nginx falls back to its own HTML page without our headers. $uri changes, so these are volatile.
  map $uri $error_page_uri { volatile; ~^/_err/ 1; default 0; }
  map "$error_page_uri:$noncanonical_path:$gateway_uri:$percent_in_path" $refuse_path {
    volatile;
    ~^0:1: 1;
    ~^0:0:1:1 1;
    default 0;
  }

  # $request is the raw request line, which exists even when the URI is rejected before parsing (bad escapes).
  map $request $gateway_route {
    ~^[A-Z]+\s/(s|v)/ 1;
    ~^[A-Z]+\s/\.well-known/oauth-protected-resource 1;
    default 0;
  }
  # The decoded URI counts too: /%73/x is a gateway route for nginx although the request line says otherwise.
  map "$gateway_route$gateway_uri" $error_dir { "00" web; default gw; }

  server {
    listen 8080;
    server_name _;
    merge_slashes on;
    client_max_body_size 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    error_page 404 /_err/$error_dir/404;
    error_page 400 405 408 411 413 414 431 /_err/$error_dir/4xx;
    # 494 (header or cookie too large) would otherwise end in nginx's own page; 501 is an unknown Transfer-Encoding.
    error_page 494 =431 /_err/$error_dir/4xx;
    error_page 501 =400 /_err/$error_dir/4xx;
    error_page 500 502 503 504 /_err/$error_dir/5xx;

    # Plain-text health for the container; not an upstream route.
    location = /__proxy/health { default_type text/plain; return 200 "ok\n"; }

    location ^~ /_err/gw/ {
      internal;
      alias /etc/nginx/errors/gw/;
      default_type application/json;
      include /etc/nginx/gateway-headers.conf;
    }
    location ^~ /_err/web/ {
      internal;
      alias /etc/nginx/errors/web/;
      default_type text/plain;
      add_header X-Content-Type-Options nosniff always;
    }

    if ($refuse_path) { return 404; }

    # Defense in depth: the admin API is never part of the public origin, even if a rewrite lands here.
    location ^~ /admin/v1/ { return 404; }

    location = /api { include /etc/nginx/to-bff.conf; }
    location ^~ /api/ { include /etc/nginx/to-bff.conf; }

    location ^~ /s/ { include /etc/nginx/to-gateway.conf; }
    location ^~ /v/ { include /etc/nginx/to-gateway.conf; }
    location = /.well-known/oauth-protected-resource { include /etc/nginx/to-gateway.conf; }
    location ^~ /.well-known/oauth-protected-resource/ { include /etc/nginx/to-gateway.conf; }
    # /.well-known/ is reserved (Angular defines no routes there): nothing else is served from it.
    location ^~ /.well-known/ { return 404; }

    # Without these, nginx answers /s and /v with a redirect to the gateway prefix; they are SPA paths.
    location = /s { include /etc/nginx/to-web.conf; }
    location = /v { include /etc/nginx/to-web.conf; }

    location / { include /etc/nginx/to-web.conf; }
  }
}
