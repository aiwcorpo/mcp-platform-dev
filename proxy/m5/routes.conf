# Rules shared by the HTTP and HTTPS listeners (included into each server block of nginx.conf).
merge_slashes on;
client_max_body_size 1m;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;

error_page 404 /_err/$error_dir/404;
error_page 400 405 408 411 413 414 431 /_err/$error_dir/4xx;
# 494 (header or cookie too large) would otherwise end in nginx's own page; 501 is an unknown Transfer-Encoding.
error_page 494 =431 /_err/$error_dir/4xx;
error_page 501 =400 /_err/$error_dir/4xx;
error_page 500 503 /_err/$error_dir/5xx;
# 502 and 504 on gateway routes are the BalancerError of mcp-contracts 6.2.0 (same text as lb/gateway.conf); the web routes keep their plain text.
error_page 502 /_err/$error_dir/502;
error_page 504 /_err/$error_dir/504;

# Plain-text health for the container; not an upstream route.
location = /__proxy/health { default_type text/plain; return 200 "ok\n"; }

location = /_err/gw/502 {
  internal;
  alias /etc/nginx/errors/gw/502;
  default_type "application/json; charset=utf-8";
  include /etc/nginx/gateway-headers.conf;
}
location = /_err/gw/504 {
  internal;
  alias /etc/nginx/errors/gw/504;
  default_type "application/json; charset=utf-8";
  include /etc/nginx/gateway-headers.conf;
}
location ^~ /_err/gw/ {
  internal;
  alias /etc/nginx/errors/gw/;
  default_type application/json;
  include /etc/nginx/gateway-headers.conf;
}
location ^~ /_err/web/ {
  internal;
  alias /etc/nginx/errors/web/;
  default_type text/plain;
  add_header X-Content-Type-Options nosniff always;
}

if ($refuse_path) { return 404; }

# Defense in depth: the admin API is never part of the public origin, even if a rewrite lands here.
location ^~ /admin/v1/ { return 404; }

location = /api { include /etc/nginx/to-bff.conf; }
location ^~ /api/ { include /etc/nginx/to-bff.conf; }

# One address for the whole platform; the filter (?systems=...) is part of the request and stays untouched. Exact match:
# /mcp/ and /mcpx are portal paths.
location = /mcp { include /etc/nginx/to-gateway.conf; }
# Saved links are gone (vector endpoint-aggregate/legacy-link-route-gone): the same 404 as the gateway gives, from here,
# so an old client config gets a JSON answer in the usual shape instead of the portal's page. No audit event, whatever the token.
location ^~ /v/ {
  default_type application/json;
  include /etc/nginx/gateway-headers.conf;
  return 404 '{"error":"not_found_or_denied","message":"The resource does not exist or you do not have access to it."}';
}
location ^~ /s/ { include /etc/nginx/to-gateway.conf; }
location = /.well-known/oauth-protected-resource { include /etc/nginx/to-gateway.conf; }
location = /.well-known/oauth-protected-resource/mcp { include /etc/nginx/to-gateway.conf; }
location ^~ /.well-known/oauth-protected-resource/ { include /etc/nginx/to-gateway.conf; }
# /.well-known/ is reserved (Angular defines no routes there): nothing else is served from it.
location ^~ /.well-known/ { return 404; }

# Without this, nginx answers /s with a redirect to the gateway prefix; it is an SPA path.
location = /s { include /etc/nginx/to-web.conf; }

location / { include /etc/nginx/to-web.conf; }
