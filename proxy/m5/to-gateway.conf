set $gateway gateway-lb:8080;
proxy_pass http://$gateway;
include /etc/nginx/proxy-common.conf;
include /etc/nginx/gateway-headers.conf;

# The portal session cookies have Path=/ (__Host- prefix), so the browser sends them here too.
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;
proxy_hide_header Set-Cookie2;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Content-Security-Policy;

# MCP responses can be event streams.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
client_max_body_size 4m;
