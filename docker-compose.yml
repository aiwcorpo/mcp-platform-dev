# mcp-platform-dev: local infrastructure for the MCP platform. NOT FOR PRODUCTION.
# Profiles:
#   (none)  infrastructure: Keycloak, OpenBao, Redis, PostgreSQL, Jira mock
#   infra   + contract stubs (WireMock) of the credential broker (C4) and gateway admin API (C5)
#   full    + platform components built by other streams (images from .env); replaces the stubs
# Run through `make` or scripts/compose.sh: they pass .env and .secrets/dev.env as --env-file, so each
# service gets only the secrets listed in its environment. Stubs come from out/contracts
# (scripts/fetch-contracts.sh, ref MCP_CONTRACTS_REF), certificates from certs/ (scripts/gen-certs.sh).
#
# Networks: "core" holds the IdP, secret store, databases, broker and gateway; "servers" holds the gateway,
# MCP servers and what they need (Redis, target systems). MCP servers cannot reach Keycloak, OpenBao,
# PostgreSQL or the broker.

name: ${COMPOSE_PROJECT_NAME:-mcp-dev}

x-system-mock: &system-mock
  image: python:3.12-alpine@sha256:0687a6bc9716edc2a6ee0fbfb0f87e7ee358b262b67c9215de91bc9b2d38ba71
  command: ["python3", "/mocks/server.py"]
  user: "65534:65534"
  read_only: true
  tmpfs: [/tmp]
  environment: {}
  volumes:
    - ./mocks/systems:/mocks:ro
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/__mock/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 30

# MCP servers speak mTLS only, so readiness is an accepted TCP connection (Tomcat opens connectors last).
x-tcp-8443-health: &tcp-8443-health
  test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 5s

# The server images of M3 are glibc images without nc: bash opens the socket.
x-bash-8443-health: &bash-8443-health
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 15s

x-mcp-server-env: &mcp-server-env
  MCP_GATEWAY_JWKS_URI: https://${MCP_GATEWAY_INTERNAL_TLS_NAME}:8443/.well-known/jwks.json
  MCP_GATEWAY_TLS_NAME: ${MCP_GATEWAY_INTERNAL_TLS_NAME}
  MCP_GATEWAY_ISSUER: https://mcp-gateway.internal
  MCP_CONNECT_URL: https://localhost:${PROXY_TLS_PORT}/connections?system={system}
  MCP_REDIS_HOST: redis
  MCP_REDIS_PORT: "6379"
  MCP_TLS_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
  MCP_TLS_TRUSTSTORE: /certs/ca/truststore.p12

networks:
  core:
    name: ${COMPOSE_PROJECT_NAME:-mcp-dev}-core
  servers:
    name: ${COMPOSE_PROJECT_NAME:-mcp-dev}-servers

volumes:
  postgres-data:
  gateway-state:
  redis-data:
  openbao-data:
  mcp-opensearch-state:
  mcp-servicedesk-state:
  mcp-gitlab-state:
  mcp-confluence-state:
  mcp-jira-state:

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm"]
    environment:
      # Fixed https frontend URL (Safari drops the Secure cookies of a plain-http Keycloak): `iss` is the same for
      # tokens obtained from the host and from containers. Browsers use https://localhost:${KEYCLOAK_TLS_PORT}
      # (certificate of the "dev public" CA, plain-http port 8080 stays for scripts and the backchannel); containers
      # reach token and JWKS at http://keycloak:8080 without trusting any CA.
      KC_HOSTNAME: https://localhost:${KEYCLOAK_TLS_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak/tls.key
      # With https enabled the management interface (health, port 9000) switches to https as well; the healthcheck below is plain.
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?run make secrets}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run make secrets}
      KC_USER_ALICE_PASSWORD: ${KC_USER_ALICE_PASSWORD:?run make secrets}
      KC_USER_BOB_PASSWORD: ${KC_USER_BOB_PASSWORD:?run make secrets}
      KC_USER_CAROL_PASSWORD: ${KC_USER_CAROL_PASSWORD:?run make secrets}
      KC_USER_MALLORY_PASSWORD: ${KC_USER_MALLORY_PASSWORD:?run make secrets}
      KC_USER_ALICE_OTP_SEED: ${KC_USER_ALICE_OTP_SEED:?run make secrets}
      KC_USER_BOB_OTP_SEED: ${KC_USER_BOB_OTP_SEED:?run make secrets}
      KC_USER_CAROL_OTP_SEED: ${KC_USER_CAROL_OTP_SEED:?run make secrets}
      KC_CLIENT_MCP_GATEWAY_SECRET: ${KC_CLIENT_MCP_GATEWAY_SECRET:?run make secrets}
      KC_CLIENT_MCP_PORTAL_BFF_SECRET: ${KC_CLIENT_MCP_PORTAL_BFF_SECRET:?run make secrets}
      KC_CLIENT_MCP_CREDENTIAL_BROKER_SECRET: ${KC_CLIENT_MCP_CREDENTIAL_BROKER_SECRET:?run make secrets}
      KC_CLIENT_MCP_GATEWAY_ADMIN_SECRET: ${KC_CLIENT_MCP_GATEWAY_ADMIN_SECRET:?run make secrets}
      KC_CLIENT_OPENSEARCH_SECRET: ${KC_CLIENT_OPENSEARCH_SECRET:?run make secrets}
      CLAUDE_CODE_CALLBACK_PORT: ${CLAUDE_CODE_CALLBACK_PORT}
      PORTAL_PORT: ${PORTAL_PORT}
      PROXY_PORT: ${PROXY_PORT}
      PROXY_TLS_PORT: ${PROXY_TLS_PORT}
    volumes:
      - ./keycloak/realm-corp.json:/opt/keycloak/data/import/realm-corp.json:ro
      - ./certs/keycloak/tls.crt:/certs/keycloak/tls.crt:ro
      - ./certs/keycloak/tls.key:/certs/keycloak/tls.key:ro
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT}:8080
      - 127.0.0.1:${KEYCLOAK_TLS_PORT}:8443
    networks:
      core:
        aliases: [keycloak.internal]
    healthcheck:
      # The image has no curl; bash /dev/tcp is enough for the management health endpoint.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  # DEV ONLY. Raft on the named volume openbao-data (openbao/server.hcl): secrets, Transit keys and TOTP seeds survive Stop/Start and
  # container recreate; `make clean`, `make reset` and `docker compose down -v` delete the volume. The server starts sealed;
  # openbao-unseal below initialises it once and unseals it after every start. Liveness only: exit 2 of `bao status` is "sealed".
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-config=/openbao/server.hcl", "-config=/openbao/audit.hcl"]
    restart: unless-stopped
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ./openbao/server.hcl:/openbao/server.hcl:ro
      - ./openbao/audit.hcl:/openbao/audit.hcl:ro
    ports:
      - 127.0.0.1:${OPENBAO_PORT}:8200
    networks:
      core:
        aliases: [openbao.internal]
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      interval: 3s
      timeout: 3s
      retries: 20

  # DEV ONLY. Initialises (once) and unseals OpenBao, and again after every restart of it; unseal key and the generated root
  # token go to ./.secrets/openbao (mode 600, never to a log). Runs as root so it can write the bind mount; on macOS Docker
  # Desktop the files belong to the host user. Healthy = the loop has seen OpenBao unsealed with the stack token (BAO_ROOT_TOKEN) valid
  # (marker /tmp/ready; no token lookup per health check, which would fill the audit log), which is what openbao-init waits for.
  openbao-unseal:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/unseal.sh"]
    user: "0:0"
    restart: unless-stopped
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_ROOT_TOKEN: ${BAO_ROOT_TOKEN:?run make secrets}
      BAO_ALLOW_REINIT: ${BAO_ALLOW_REINIT:-0}
    volumes:
      - ./openbao/unseal.sh:/unseal.sh:ro
      - ./.secrets/openbao:/keys
    networks: [core]
    depends_on:
      openbao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Named volumes are created root-owned; the server images run as uid 999 and keep the accepted policy revision
  # in /app/state (rollback protection), so the volumes are handed over once.
  server-state-init:
    profiles: [full]
    image: python:3.12-alpine@sha256:0687a6bc9716edc2a6ee0fbfb0f87e7ee358b262b67c9215de91bc9b2d38ba71
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 999:999 /state && chmod 700 /state/*"]
    volumes:
      - mcp-jira-state:/state/jira
      - mcp-confluence-state:/state/confluence
      - mcp-gitlab-state:/state/gitlab
      - mcp-servicedesk-state:/state/servicedesk
      - mcp-opensearch-state:/state/opensearch
    restart: "no"

  openbao-init:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_ROOT_TOKEN: ${BAO_ROOT_TOKEN:?run make secrets}
      BAO_BROKER_ROLE_ID: ${BAO_BROKER_ROLE_ID:?run make secrets}
      BAO_BROKER_SECRET_ID: ${BAO_BROKER_SECRET_ID:?run make secrets}
      BAO_RENEW_SECRET_ID: ${BAO_RENEW_SECRET_ID:-0}
      BAO_SECRET_ID_TTL: ${BAO_SECRET_ID_TTL:-720h}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:?run make secrets}
      SERVICEDESK_API_KEY: ${SERVICEDESK_API_KEY:?run make secrets}
      KC_CLIENT_MCP_CREDENTIAL_BROKER_SECRET: ${KC_CLIENT_MCP_CREDENTIAL_BROKER_SECRET:?run make secrets}
    volumes:
      - ./openbao/init.sh:/init.sh:ro
    networks: [core]
    depends_on:
      openbao-unseal:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8.8.4-alpine@sha256:be8dfdf58574d626e0abe03073ce9178509e0e9564a316e34e71d2289b8370e1
    user: redis
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?run make secrets}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?run make secrets}
      REDIS_BROKER_PASSWORD: ${REDIS_BROKER_PASSWORD:?run make secrets}
      REDIS_PORTAL_BFF_PASSWORD: ${REDIS_PORTAL_BFF_PASSWORD:?run make secrets}
      REDIS_MCP_JIRA_PASSWORD: ${REDIS_MCP_JIRA_PASSWORD:?run make secrets}
      REDIS_MCP_CONFLUENCE_PASSWORD: ${REDIS_MCP_CONFLUENCE_PASSWORD:?run make secrets}
      REDIS_MCP_GITLAB_PASSWORD: ${REDIS_MCP_GITLAB_PASSWORD:?run make secrets}
      REDIS_MCP_SERVICEDESK_PASSWORD: ${REDIS_MCP_SERVICEDESK_PASSWORD:?run make secrets}
      REDIS_MCP_OPENSEARCH_PASSWORD: ${REDIS_MCP_OPENSEARCH_PASSWORD:?run make secrets}
    volumes:
      - ./redis/start.sh:/start.sh:ro
      - ./redis/portal-bff.rules:/portal-bff.rules:ro
      - ./redis/broker.rules:/broker.rules:ro
      - ./redis/gateway.rules:/gateway.rules:ro
      # AOF (confirmations, counters and locks of the gateway survive a recreate of the container).
      - redis-data:/data
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    networks:
      core:
        aliases: [redis.internal]
      servers:
        aliases: [redis.internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_ADMIN_PASSWORD\" redis-cli --user admin ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make secrets}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?run make secrets}
      BROKER_DB_PASSWORD: ${BROKER_DB_PASSWORD:?run make secrets}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    networks:
      core:
        aliases: [postgres.internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broker && pg_isready -U postgres -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Admin API (/__admin, request journal) requires Basic auth (JIRA_MOCK_ADMIN_PASSWORD, host tools only):
  # the mock sits in both networks, and an open admin API would let an MCP server rewrite mappings or add
  # proxy stubs into the core network. Proxy targets are limited to an unroutable TEST-NET address.
  # WireMock takes the credentials only as an option; they protect a mock with fixed test PATs.
  jira-mock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        exec /docker-entrypoint.sh --port 8080 --disable-banner --async-response-enabled true
        --root-dir /mocks/jira --max-request-journal-entries 1000
        --admin-api-basic-auth "admin:$$JIRA_MOCK_ADMIN_PASSWORD"
        --allow-proxy-targets 192.0.2.1
    environment:
      JIRA_MOCK_ADMIN_PASSWORD: ${JIRA_MOCK_ADMIN_PASSWORD:?run make secrets}
    volumes:
      - ./mocks/jira:/mocks/jira:ro
    ports:
      - 127.0.0.1:${JIRA_MOCK_PORT}:8080
    networks:
      core:
        aliases: [jira.internal]
      servers:
        aliases: [jira.internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u \"admin:$$JIRA_MOCK_ADMIN_PASSWORD\" http://127.0.0.1:8080/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ---- System mocks written in Python (mocks/systems). One image, MOCK_SYSTEM selects the module.
  # Like the Jira mock they sit in "core" (the broker calls whoami and the OAuth token endpoint) and
  # "servers" (MCP servers call the REST API). /__mock/journal needs Basic auth admin:$MOCK_ADMIN_PASSWORD.

  gitlab-mock:
    <<: *system-mock
    environment:
      MOCK_SYSTEM: gitlab
      PYTHONDONTWRITEBYTECODE: "1"
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?run make secrets}
      MOCK_GITLAB_CLIENT_ID: mcp-broker
      MOCK_GITLAB_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:?run make secrets}
      # Lifetime of access tokens in seconds; lower it (GITLAB_MOCK_TOKEN_TTL=60 in .env) to watch the broker refresh.
      MOCK_GITLAB_TOKEN_TTL: ${GITLAB_MOCK_TOKEN_TTL:-7200}
      # The broker's callback is the BFF (C12) on the single public origin; 18090 is the BFF run on the host.
      MOCK_GITLAB_REDIRECT_URIS: https://localhost:${PROXY_TLS_PORT}/api/v1/oauth/callback,http://localhost:${PROXY_PORT}/api/v1/oauth/callback,http://localhost:${PORTAL_PORT}/api/v1/oauth/callback
    ports:
      - 127.0.0.1:${GITLAB_MOCK_PORT}:8080
    networks:
      core:
        aliases: [gitlab.internal]
      servers:
        aliases: [gitlab.internal]

  confluence-mock:
    <<: *system-mock
    environment:
      MOCK_SYSTEM: confluence
      PYTHONDONTWRITEBYTECODE: "1"
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?run make secrets}
    ports:
      - 127.0.0.1:${CONFLUENCE_MOCK_PORT}:8080
    networks:
      core:
        aliases: [confluence.internal]
      servers:
        aliases: [confluence.internal]

  servicedesk-mock:
    <<: *system-mock
    environment:
      MOCK_SYSTEM: servicedesk
      PYTHONDONTWRITEBYTECODE: "1"
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?run make secrets}
      MOCK_SERVICEDESK_API_KEY: ${SERVICEDESK_API_KEY:?run make secrets}
    ports:
      - 127.0.0.1:${SERVICEDESK_MOCK_PORT}:8080
    networks:
      servers:
        aliases: [servicedesk.internal]

  opensearch-mock:
    <<: *system-mock
    environment:
      MOCK_SYSTEM: opensearch
      MOCK_OPENSEARCH_ISSUER: https://localhost:${KEYCLOAK_TLS_PORT}/realms/corp
      PYTHONDONTWRITEBYTECODE: "1"
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?run make secrets}
    ports:
      - 127.0.0.1:${OPENSEARCH_MOCK_PORT}:8080
    networks:
      servers:
        aliases: [opensearch.internal]

  # Policy bundle server (ws-09 publishes into POLICY_REPOSITORY_DIR, read-only here). In both networks: the
  # gateway pulls from core, MCP servers (starter) from servers.
  policies:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./policies/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./policies/locations.conf:/etc/nginx/policies-locations.conf:ro
      - ./certs/policies/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./certs/policies/tls.key:/etc/nginx/tls/tls.key:ro
      - ${POLICY_REPOSITORY_DIR:-../mcp-policies/out/repository}:/srv/policies:ro
    ports:
      - 127.0.0.1:${POLICIES_PORT}:8080
    networks:
      core:
        aliases: [policies.internal]
      servers:
        aliases: [policies.internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Contract stub of the credential broker (C4), served only over mTLS like the real broker.
  # It does not check the client CN or token contents (see mcp-contracts README). The request journal is
  # off because PUT .../secret bodies carry PATs. `make up-full` stops it (same network alias as the broker).
  broker-mock:
    profiles: [infra]
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint: ["/bin/bash", "-c"]
    # WireMock takes keystore passwords only as options; the password protects dev keys only.
    command:
      - >-
        exec /docker-entrypoint.sh --disable-http --https-port 8443 --disable-banner --no-request-journal
        --root-dir /contracts/mocks/wiremock/credential-broker
        --https-keystore /certs/server/keystore.p12 --keystore-type PKCS12
        --keystore-password "$$TLS_STORE_PASSWORD" --key-manager-password "$$TLS_STORE_PASSWORD"
        --https-require-client-cert --https-truststore /certs/ca/truststore.p12 --truststore-type PKCS12
        --truststore-password "$$TLS_STORE_PASSWORD"
    environment:
      TLS_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
    volumes:
      - ./out/contracts:/contracts:ro
      - ./certs/mcp-credential-broker/keystore.p12:/certs/server/keystore.p12:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/mcp-portal-bff/tls.crt:/certs/healthcheck/tls.crt:ro
      - ./certs/mcp-portal-bff/tls.key:/certs/healthcheck/tls.key:ro
    ports:
      - 127.0.0.1:${BROKER_MOCK_PORT}:8443
    networks:
      core:
        aliases: ["${MCP_BROKER_TLS_NAME}"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/certs/ca/ca.crt", "--cert", "/certs/healthcheck/tls.crt", "--key", "/certs/healthcheck/tls.key", "https://localhost:8443/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Contract stub of the gateway admin API (C5), mTLS as well. Stopped by `make up-full`.
  gateway-admin-mock:
    profiles: [infra]
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        exec /docker-entrypoint.sh --disable-http --https-port 8443 --disable-banner --no-request-journal
        --root-dir /contracts/mocks/wiremock/gateway-admin
        --https-keystore /certs/server/keystore.p12 --keystore-type PKCS12
        --keystore-password "$$TLS_STORE_PASSWORD" --key-manager-password "$$TLS_STORE_PASSWORD"
        --https-require-client-cert --https-truststore /certs/ca/truststore.p12 --truststore-type PKCS12
        --truststore-password "$$TLS_STORE_PASSWORD"
    environment:
      TLS_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
    volumes:
      - ./out/contracts:/contracts:ro
      - ./certs/mcp-gateway/keystore.p12:/certs/server/keystore.p12:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/mcp-portal-bff/tls.crt:/certs/healthcheck/tls.crt:ro
      - ./certs/mcp-portal-bff/tls.key:/certs/healthcheck/tls.key:ro
    ports:
      - 127.0.0.1:${GATEWAY_ADMIN_MOCK_PORT}:8443
    networks:
      core:
        aliases: ["${MCP_GATEWAY_INTERNAL_TLS_NAME}"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/certs/ca/ca.crt", "--cert", "/certs/healthcheck/tls.crt", "--key", "/certs/healthcheck/tls.key", "https://localhost:8443/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ---- Platform components (profile "full"). Images are built by ws-05, ws-06, ws-04.
  # Environment below is what this environment provides; each component maps it to its own config.
  # See docs/integracja.md.

  mcp-gateway:
    profiles: [full]
    image: ${MCP_GATEWAY_IMAGE}
    pull_policy: never
    environment:
      MCP_OIDC_ISSUER: https://localhost:${KEYCLOAK_TLS_PORT}/realms/corp
      MCP_OIDC_JWKS_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/certs
      MCP_OIDC_TOKEN_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/token
      MCP_OIDC_AUDIENCE: mcp-gateway
      # The single public origin (the proxy): resource_metadata, "resource" of RFC 9728 (<origin>/mcp from M5) and connectUrl.
      MCP_PUBLIC_URL: https://localhost:${PROXY_TLS_PORT}
      # Dev only: Keycloak's token endpoint (token exchange) is plain http in this stack.
      MCP_ALLOW_PLAIN_HTTP: "true"
      MCP_OIDC_CLIENT_ID: mcp-gateway
      MCP_OIDC_CLIENT_SECRET: ${KC_CLIENT_MCP_GATEWAY_SECRET:?run make secrets}
      MCP_INTERNAL_TLS_NAME: ${MCP_GATEWAY_INTERNAL_TLS_NAME}
      MCP_BROKER_URL: https://${MCP_BROKER_TLS_NAME}:8443
      MCP_BROKER_TLS_NAME: ${MCP_BROKER_TLS_NAME}
      MCP_SERVER_JIRA_URL: https://mcp-jira.internal:8443
      MCP_SERVER_CONFLUENCE_MCP_URL: https://mcp-confluence.internal:8443/mcp
      MCP_SERVER_GITLAB_MCP_URL: https://mcp-gitlab.internal:8443/mcp
      MCP_SERVER_SERVICEDESK_MCP_URL: https://mcp-servicedesk.internal:8443/mcp
      MCP_SERVER_OPENSEARCH_MCP_URL: https://mcp-opensearch.internal:8443/mcp
      # C5 (BFF): client certificate CN and azp of the exchanged token.
      MCP_ADMIN_CLIENT_CNS: mcp-portal-bff
      MCP_ADMIN_AUTHORIZED_PARTY: mcp-portal-bff
      MCP_REDIS_HOST: redis
      MCP_REDIS_PORT: "6379"
      MCP_REDIS_USER: gateway
      MCP_REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?run make secrets}
      MCP_REDIS_KEY_PREFIX: "gw:"
      MCP_DB_URL: jdbc:postgresql://postgres:5432/gateway
      MCP_DB_USER: gateway
      MCP_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?run make secrets}
      MCP_TLS_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
      MCP_TLS_KEYSTORE: /certs/mcp-gateway/keystore.p12
      MCP_TLS_TRUSTSTORE: /certs/ca/truststore.p12
      # Policy bundles (C7) pulled from the bundle server; dev keys of ws-09 (test-*) are accepted only with the flag.
      MCP_POLICY_MAIN_URL: http://policies.internal:8080/policies/main/
      MCP_POLICY_OVERRIDES_URL: http://policies.internal:8080/policies/overrides/
      MCP_POLICY_MAIN_KEY_ID: ${POLICY_KEY_MAIN_ID}
      MCP_POLICY_MAIN_KEY_FILE: /keys/${POLICY_KEY_MAIN_ID}.public.pem
      MCP_POLICY_OVERRIDES_KEY_ID: ${POLICY_KEY_OVERRIDES_ID}
      MCP_POLICY_OVERRIDES_KEY_FILE: /keys/${POLICY_KEY_OVERRIDES_ID}.public.pem
      MCP_POLICY_ALLOW_TEST_KEYS: "true"
      MCP_POLICY_STATE_DIR: /app/state
      # Profile devstack with both acknowledgements is the only place for development relaxations of the gateway (README of
      # the gateway, "Profil devstack"); only the relaxations this stack uses are set below. Never set outside mcp-platform-dev.
      SPRING_PROFILES_ACTIVE: devstack
      MCP_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_DEVSTACK_ACKNOWLEDGED: "true"
      # Dev only: the gateway takes the first manifest of a server without a registry row from the server itself (registry
      # mode stays "required"). The production path is the CI PUT (CN mcp-registry-ci-<serverId>) with a manifest built from the reviewed commit; make registry-register plays it.
      MCP_REGISTRY_BOOTSTRAP: "true"
      MCP_ACTIVITY_CURSOR_KEY: ${MCP_ACTIVITY_CURSOR_KEY:?run make secrets}
    volumes:
      - gateway-state:/app/state
      - ${POLICY_KEYS_DIR}/${POLICY_KEY_MAIN_ID}.public.pem:/keys/${POLICY_KEY_MAIN_ID}.public.pem:ro
      - ${POLICY_KEYS_DIR}/${POLICY_KEY_OVERRIDES_ID}.public.pem:/keys/${POLICY_KEY_OVERRIDES_ID}.public.pem:ro
      - ./certs/mcp-gateway/keystore.p12:/certs/mcp-gateway/keystore.p12:ro
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
    ports:
      # Not an entry for clients: browsers and MCP clients use the proxy (PROXY_PORT). Kept for `make m1`, whose
      # scenarios (mcp-e2e harness) talk to 127.0.0.1:18000 directly; the advertised origin is the proxy's anyway.
      - 127.0.0.1:${GATEWAY_PORT}:8080
      # Internal TLS endpoint (JWKS C2, actuator), published for tests from the host (mTLS still required).
      - 127.0.0.1:${GATEWAY_INTERNAL_PORT}:8443
    networks:
      core:
        aliases: ["${MCP_GATEWAY_INTERNAL_TLS_NAME}"]
      servers:
        aliases: ["${MCP_GATEWAY_INTERNAL_TLS_NAME}"]
    # Any answer of the public listener means Flyway and the context are done (Tomcat opens connectors last).
    healthcheck:
      # The glibc image (Cedar library) has no wget or curl; bash opens the socket.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/oauth-protected-resource HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 5 <&3 | grep -q HTTP"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
    depends_on:
      keycloak: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  mcp-credential-broker:
    profiles: [full]
    image: ${MCP_CREDENTIAL_BROKER_IMAGE}
    pull_policy: never
    environment:
      MCP_OIDC_ISSUER: https://localhost:${KEYCLOAK_TLS_PORT}/realms/corp
      MCP_OIDC_JWKS_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/certs
      MCP_OIDC_TOKEN_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/token
      MCP_OIDC_AUDIENCE: mcp-credential-broker
      MCP_OIDC_CLIENT_ID: mcp-credential-broker
      MCP_OIDC_CLIENT_SECRET: ${KC_CLIENT_MCP_CREDENTIAL_BROKER_SECRET:?run make secrets}
      MCP_GATEWAY_JWKS_URI: https://${MCP_GATEWAY_INTERNAL_TLS_NAME}:8443/.well-known/jwks.json
      MCP_GATEWAY_TLS_NAME: ${MCP_GATEWAY_INTERNAL_TLS_NAME}
      MCP_BAO_ADDR: http://openbao:8200
      MCP_BAO_ROLE_ID: ${BAO_BROKER_ROLE_ID:?run make secrets}
      MCP_BAO_SECRET_ID: ${BAO_BROKER_SECRET_ID:?run make secrets}
      MCP_JIRA_URL: http://jira.internal:8080
      # Single public origin (profile m2): connectUrl and the OAuth redirect_uri <MCP_PORTAL_URL>/api/v1/oauth/callback.
      MCP_PORTAL_URL: https://localhost:${PROXY_TLS_PORT}
      # Dev only: OpenBao and the Jira mock speak plain http here; the broker requires https otherwise.
      MCP_ALLOW_PLAIN_HTTP: "true"
      # Systems beyond Jira (mocks of this stack, plain http). GitLab: "Polacz przez OAuth"; the browser opens the
      # authorize URL on the published port of the mock, the broker calls token and whoami inside the network.
      BROKER_SYSTEMS_CONFLUENCE_BASEURL: http://confluence.internal:8080
      BROKER_SYSTEMS_CONFLUENCE_ADAPTER: atlassian-dc
      BROKER_SYSTEMS_CONFLUENCE_SUPPORTEDTYPES: user-secret
      BROKER_SYSTEMS_CONFLUENCE_DEFAULTTYPE: user-secret
      BROKER_SYSTEMS_GITLAB_BASEURL: http://gitlab.internal:8080
      BROKER_SYSTEMS_GITLAB_ADAPTER: gitlab
      BROKER_SYSTEMS_GITLAB_SUPPORTEDTYPES: user-oauth,user-secret
      BROKER_SYSTEMS_GITLAB_DEFAULTTYPE: user-oauth
      BROKER_SYSTEMS_GITLAB_OAUTHSCOPES: api
      BROKER_SYSTEMS_GITLAB_OAUTH_CLIENTID: mcp-broker
      BROKER_SYSTEMS_GITLAB_OAUTH_AUTHORIZEURL: http://localhost:${GITLAB_MOCK_PORT}/oauth/authorize
      MCP_REDIS_HOST: redis
      MCP_REDIS_PORT: "6379"
      MCP_REDIS_USER: broker
      MCP_REDIS_PASSWORD: ${REDIS_BROKER_PASSWORD:?run make secrets}
      MCP_REDIS_KEY_PREFIX: "broker:"
      MCP_DB_URL: jdbc:postgresql://postgres:5432/broker
      MCP_DB_USER: broker
      MCP_DB_PASSWORD: ${BROKER_DB_PASSWORD:?run make secrets}
      MCP_TLS_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
      MCP_TLS_KEYSTORE: /certs/mcp-credential-broker/keystore.p12
      MCP_TLS_TRUSTSTORE: /certs/ca/truststore.p12
    volumes:
      - ./certs/mcp-credential-broker:/certs/mcp-credential-broker:ro
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
    ports:
      - 127.0.0.1:${BROKER_PORT}:8443
    networks:
      core:
        aliases: ["${MCP_BROKER_TLS_NAME}"]
    # mTLS-only listener: an accepted TCP connection means the application finished starting.
    healthcheck: *tcp-8443-health
    depends_on:
      keycloak: {condition: service_healthy}
      openbao-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  mcp-jira:
    profiles: [full]
    image: ${MCP_JIRA_IMAGE}
    pull_policy: never
    environment:
      MCP_GATEWAY_JWKS_URI: https://${MCP_GATEWAY_INTERNAL_TLS_NAME}:8443/.well-known/jwks.json
      MCP_GATEWAY_TLS_NAME: ${MCP_GATEWAY_INTERNAL_TLS_NAME}
      MCP_GATEWAY_ISSUER: https://mcp-gateway.internal
      # Portal page for credential_required (C10); same shape as the broker's connectUrl (C4 example).
      MCP_CONNECT_URL: https://localhost:${PROXY_TLS_PORT}/connections?system={system}
      # System API address; the template calls this MCP_<SYSTEM>_URL (MCP_EXAMPLE_URL in the example).
      MCP_JIRA_URL: http://jira.internal:8080
      # The Jira mock speaks plain http and exists only in this dev environment; servers built from the
      # template (c1258c4+) refuse an http backend outside the 'dev' profile without this switch. Never set
      # it against a real Jira (the PAT would travel in clear text).
      MCP_JIRA_ALLOW_PLAIN_HTTP: "true"
      MCP_REDIS_HOST: redis
      MCP_REDIS_PORT: "6379"
      MCP_REDIS_USER: mcp-jira
      MCP_REDIS_PASSWORD: ${REDIS_MCP_JIRA_PASSWORD:?run make secrets}
      MCP_REDIS_KEY_PREFIX: "jti:mcp-jira:"
      MCP_TLS_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
      MCP_TLS_KEYSTORE: /certs/mcp-jira/keystore.p12
      MCP_TLS_TRUSTSTORE: /certs/ca/truststore.p12
      # Signed policy bundle (C7), the same the gateway evaluates, and the manifest the registry takes (C6).
      MCP_POLICY_URL: https://policies.internal:8443/policies/main/latest.json
      MCP_POLICY_KEY_ID: ${POLICY_KEY_MAIN_ID}
      MCP_POLICY_PUBLIC_KEY_FILE: /keys/${POLICY_KEY_MAIN_ID}.public.pem
      MCP_POLICY_STATE_DIR: /app/state
      AIWCORPO_MCP_PLATFORM_POLICY_SSL_BUNDLE: mcp-internal-ca
      # Starter profile for this stack only (not dev, which a container refuses): allows the dev key of ws-09 (test-*) for
      # policy bundles and nothing else; it logs a warning at every start and sets the metric mcp_server_devstack_active
      # (the C6 manifest has no field for the environment). The gateway signs the internal JWT with ephemeral keys, so
      # INTERNAL_JWT_ALLOW_TEST_KEYS is not set. Never set outside mcp-platform-dev.
      SPRING_PROFILES_ACTIVE: devstack
      MCP_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_POLICY_ALLOW_TEST_KEYS: "true"
      MCP_INTERNAL_URL: https://mcp-jira.internal:8443/mcp
      MCP_ACCEPTED_CREDENTIAL_TYPES: user-secret
    volumes:
      - mcp-jira-state:/app/state
      - ${POLICY_KEYS_DIR}/${POLICY_KEY_MAIN_ID}.public.pem:/keys/${POLICY_KEY_MAIN_ID}.public.pem:ro
      - ./certs/mcp-jira/keystore.p12:/certs/mcp-jira/keystore.p12:ro
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
    # Published only so that tests from the host can attack the server directly (A1, A3); every request still
    # needs the mcp-gateway client certificate and an internal JWT.
    ports:
      - 127.0.0.1:${MCP_JIRA_PORT}:8443
    networks:
      servers:
        aliases: [mcp-jira.internal]
    healthcheck: *bash-8443-health
    depends_on:
      server-state-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      jira-mock: {condition: service_healthy}

  # ---- Profile "m2": single public origin, portal and the remaining MCP servers (images: .env, built by
  # scripts/build-images-m2.sh). Started by `make up-m2` on top of `make up-full`.

  # The only published entry for browsers and MCP clients: https://localhost:${PROXY_TLS_PORT} (certificate of the "dev public" CA, scripts/gen-public-cert.sh); http://localhost:${PROXY_PORT} serves the same routes for tools without TLS. Rules: proxy/nginx.conf,
  # tests: `make proxy-test`. It reaches the gateway's public listener (8080) only; the gateway's mTLS listener
  # (C5, JWKS) has no route here and no client certificate.
  proxy:
    profiles: [m2]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    tmpfs: [/tmp]
    environment:
      PUBLIC_PORT: ${PROXY_PORT}
      PUBLIC_TLS_PORT: ${PROXY_TLS_PORT}
    # nginx cannot read the environment: the public origin of each listener (the one Host the upstreams ever see)
    # is written to a file the main config includes.
    command:
      - /bin/sh
      - -c
      - |
        printf 'map $$server_port $$public_host { 8080 "localhost:%s"; 8443 "localhost:%s"; }\nmap $$server_port $$public_port { 8080 "%s"; 8443 "%s"; }\n' "$$PUBLIC_PORT" "$$PUBLIC_TLS_PORT" "$$PUBLIC_PORT" "$$PUBLIC_TLS_PORT" > /tmp/public-origin.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/routes.conf:/etc/nginx/routes.conf:ro
      - ./proxy/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./proxy/to-bff.conf:/etc/nginx/to-bff.conf:ro
      - ./proxy/to-gateway.conf:/etc/nginx/to-gateway.conf:ro
      - ./proxy/to-web.conf:/etc/nginx/to-web.conf:ro
      - ./proxy/gateway-headers.conf:/etc/nginx/gateway-headers.conf:ro
      - ./proxy/errors:/etc/nginx/errors:ro
      - ./certs/proxy/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./certs/proxy/tls.key:/etc/nginx/tls/tls.key:ro
    ports:
      - 127.0.0.1:${PROXY_PORT}:8080
      - 127.0.0.1:${PROXY_TLS_PORT}:8443
    networks:
      core:
        aliases: [proxy.internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__proxy/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  portal-web:
    profiles: [m2]
    image: ${MCP_PORTAL_WEB_IMAGE}
    pull_policy: never
    read_only: true
    tmpfs: [/tmp]
    networks:
      core:
        aliases: [portal-web.internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__web/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  portal-bff:
    profiles: [m2]
    image: ${MCP_PORTAL_BFF_IMAGE}
    pull_policy: never
    environment:
      PORTAL_PORT: "8080"
      # No discovery: the issuer is only compared with `iss`; the browser goes to the public https address, the
      # BFF itself uses the plain-http alias of Keycloak on the core network.
      PORTAL_OIDC_ISSUER_URI: https://localhost:${KEYCLOAK_TLS_PORT}/realms/corp
      PORTAL_OIDC_AUTHORIZATION_URI: https://localhost:${KEYCLOAK_TLS_PORT}/realms/corp/protocol/openid-connect/auth
      PORTAL_OIDC_TOKEN_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/token
      PORTAL_OIDC_JWK_SET_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/certs
      PORTAL_OIDC_END_SESSION_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/logout
      PORTAL_OIDC_CLIENT_ID: mcp-portal-bff
      PORTAL_OIDC_CLIENT_SECRET: ${KC_CLIENT_MCP_PORTAL_BFF_SECRET:?run make secrets}
      PORTAL_BROKER_URL: https://${MCP_BROKER_TLS_NAME}:8443
      PORTAL_BROKER_TLS_NAME: ${MCP_BROKER_TLS_NAME}
      PORTAL_GATEWAY_ADMIN_URL: https://${MCP_GATEWAY_INTERNAL_TLS_NAME}:8443
      PORTAL_GATEWAY_ADMIN_TLS_NAME: ${MCP_GATEWAY_INTERNAL_TLS_NAME}
      PORTAL_PUBLIC_BASE_URL: https://localhost:${PROXY_TLS_PORT}
      # Flags of the claude mcp add command shown in the portal; empty by default outside the dev profile.
      PORTAL_CLIENT_CONFIGS_CLAUDE_CODE_CLIENT_ID: claude-code
      PORTAL_CLIENT_CONFIGS_CLAUDE_CODE_CALLBACK_PORT: "${CLAUDE_CODE_CALLBACK_PORT}"
      PORTAL_TLS_KEYSTORE: /certs/mcp-portal-bff/keystore.p12
      PORTAL_TLS_KEYSTORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
      PORTAL_TLS_TRUSTSTORE: /certs/ca/truststore.p12
      PORTAL_TLS_TRUSTSTORE_PASSWORD: ${TLS_STORE_PASSWORD:?run make secrets}
      # X-Forwarded-* are trusted from the proxy only: the entrypoint resolves this name to its address.
      PORTAL_TRUSTED_PROXY_HOST: proxy.internal
      PORTAL_IGA_MOCK_FILE: /dev-data/iga-mock.yaml
      # Step-up (registering the Authenticator): the realm reports the level reached in `acr`; "mfa" is the level 2 of
      # keycloak/realm-corp.json (password + OTP).
      PORTAL_STEP_UP_ACR_VALUES: mfa
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./certs/mcp-portal-bff/keystore.p12:/certs/mcp-portal-bff/keystore.p12:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
      - ../mcp-portal/bff/dev:/dev-data:ro
    networks:
      core:
        aliases: [portal-bff.internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    depends_on:
      keycloak: {condition: service_healthy}
      proxy: {condition: service_healthy}

  mcp-confluence:
    profiles: [m2]
    image: ${MCP_CONFLUENCE_IMAGE}
    pull_policy: never
    environment:
      <<: *mcp-server-env
      MCP_REDIS_USER: mcp-confluence
      MCP_REDIS_PASSWORD: ${REDIS_MCP_CONFLUENCE_PASSWORD:?run make secrets}
      MCP_REDIS_KEY_PREFIX: "jti:mcp-confluence:"
      MCP_TLS_KEYSTORE: /certs/mcp-confluence/keystore.p12
      # The Confluence mock speaks plain http; dev only (the PAT would travel in clear text).
      MCP_CONFLUENCE_URL: http://confluence.internal:8080
      MCP_CONFLUENCE_ALLOW_PLAIN_HTTP: "true"
      # Signed policy bundle (C7), the same the gateway evaluates, and the manifest the registry takes (C6).
      MCP_POLICY_URL: https://policies.internal:8443/policies/main/latest.json
      MCP_POLICY_KEY_ID: ${POLICY_KEY_MAIN_ID}
      MCP_POLICY_PUBLIC_KEY_FILE: /keys/${POLICY_KEY_MAIN_ID}.public.pem
      MCP_POLICY_STATE_DIR: /app/state
      AIWCORPO_MCP_PLATFORM_POLICY_SSL_BUNDLE: mcp-internal-ca
      # Starter profile for this stack only (not dev, which a container refuses): allows the dev key of ws-09 (test-*) for
      # policy bundles and nothing else; it logs a warning at every start and sets the metric mcp_server_devstack_active
      # (the C6 manifest has no field for the environment). The gateway signs the internal JWT with ephemeral keys, so
      # INTERNAL_JWT_ALLOW_TEST_KEYS is not set. Never set outside mcp-platform-dev.
      SPRING_PROFILES_ACTIVE: devstack
      MCP_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_POLICY_ALLOW_TEST_KEYS: "true"
      MCP_INTERNAL_URL: https://mcp-confluence.internal:8443/mcp
      MCP_ACCEPTED_CREDENTIAL_TYPES: user-secret
    volumes:
      - mcp-confluence-state:/app/state
      - ${POLICY_KEYS_DIR}/${POLICY_KEY_MAIN_ID}.public.pem:/keys/${POLICY_KEY_MAIN_ID}.public.pem:ro
      - ./certs/mcp-confluence/keystore.p12:/certs/mcp-confluence/keystore.p12:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
    networks:
      servers:
        aliases: [mcp-confluence.internal]
    healthcheck: *bash-8443-health
    depends_on:
      server-state-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      confluence-mock: {condition: service_healthy}

  mcp-gitlab:
    profiles: [m2]
    image: ${MCP_GITLAB_IMAGE}
    pull_policy: never
    environment:
      <<: *mcp-server-env
      MCP_REDIS_USER: mcp-gitlab
      MCP_REDIS_PASSWORD: ${REDIS_MCP_GITLAB_PASSWORD:?run make secrets}
      MCP_REDIS_KEY_PREFIX: "jti:mcp-gitlab:"
      MCP_TLS_KEYSTORE: /certs/mcp-gitlab/keystore.p12
      MCP_GITLAB_URL: http://gitlab.internal:8080
      MCP_GITLAB_ALLOW_PLAIN_HTTP: "true"
      MCP_GITLAB_FILE_MAX_BYTES: "262144"
      # Signed policy bundle (C7), the same the gateway evaluates, and the manifest the registry takes (C6).
      MCP_POLICY_URL: https://policies.internal:8443/policies/main/latest.json
      MCP_POLICY_KEY_ID: ${POLICY_KEY_MAIN_ID}
      MCP_POLICY_PUBLIC_KEY_FILE: /keys/${POLICY_KEY_MAIN_ID}.public.pem
      MCP_POLICY_STATE_DIR: /app/state
      AIWCORPO_MCP_PLATFORM_POLICY_SSL_BUNDLE: mcp-internal-ca
      # Starter profile for this stack only (not dev, which a container refuses): allows the dev key of ws-09 (test-*) for
      # policy bundles and nothing else; it logs a warning at every start and sets the metric mcp_server_devstack_active
      # (the C6 manifest has no field for the environment). The gateway signs the internal JWT with ephemeral keys, so
      # INTERNAL_JWT_ALLOW_TEST_KEYS is not set. Never set outside mcp-platform-dev.
      SPRING_PROFILES_ACTIVE: devstack
      MCP_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_POLICY_ALLOW_TEST_KEYS: "true"
      MCP_INTERNAL_URL: https://mcp-gitlab.internal:8443/mcp
      MCP_ACCEPTED_CREDENTIAL_TYPES: user-secret,user-oauth
    volumes:
      - mcp-gitlab-state:/app/state
      - ${POLICY_KEYS_DIR}/${POLICY_KEY_MAIN_ID}.public.pem:/keys/${POLICY_KEY_MAIN_ID}.public.pem:ro
      - ./certs/mcp-gitlab/keystore.p12:/certs/mcp-gitlab/keystore.p12:ro
      - ./certs/ca/truststore.p12:/certs/ca/truststore.p12:ro
    networks:
      servers:
        aliases: [mcp-gitlab.internal]
    healthcheck: *bash-8443-health
    depends_on:
      server-state-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      gitlab-mock: {condition: service_healthy}

