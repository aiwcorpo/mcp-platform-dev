# M5 layer, added by scripts/compose.sh only while M5_ACTIVE=1 (set in .env by make m5-switch, after the M4 layer). Until then the
# stack keeps its M4 configuration. NOT FOR PRODUCTION. What it changes:
#   - gateway and broker run in two instances each; the old service names are instance 1, the TLS names
#     (mcp-gateway.internal, mcp-credential-broker.internal) and the old host ports (GATEWAY_PORT, GATEWAY_INTERNAL_PORT, BROKER_PORT)
#     move to the balancers in front of them (lb/gateway.conf, lb/broker.conf);
#   - the gateway instances share the keys of the internal JWT (scripts/gen-c2-keys.sh) and have MCP_TOOLS_LIST_TIMEOUT;
#   - the policy bundle server logs downloads on stdout (policies/nginx.m5.conf);
#   - the proxy serves /mcp and routes to gateway-lb, without /v/ (proxy/m5/);
#   - artifact services of D12 (package server, image registry) in the network "ci", started apart: make m5-artifacts.
# Redis (one instance) and PostgreSQL stay shared by both instances of each component. Ports of new services: m5.env.

# A container limit plus a heap that fits in it: the JVM exits on its own out-of-memory error (ExitOnOutOfMemoryError, the
# container restarts cleanly and the log names the cause) instead of the kernel killing it with exit 137 at the limit, or the
# heap growing to a quarter of the Docker VM (4 GiB seen on a gateway instance under load).
x-jvm-limit-environment: &jvm-limit-environment
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError

x-gateway-m5-environment: &gateway-m5-environment
  <<: *jvm-limit-environment
  # Keys (user, reason, target) kept by the audit throttle of repeated refusals, per user and reason (contracts 5.1.0, CC-191).
  MCP_AUDIT_THROTTLE_MAX_TARGETS_PER_USER: ${MCP_AUDIT_THROTTLE_MAX_TARGETS_PER_USER:-50}
  # Time limit of one tools/list read per MCP server (milliseconds; contracts 5.1.0, CC-180).
  MCP_TOOLS_LIST_TIMEOUT: ${MCP_TOOLS_LIST_TIMEOUT:-3000}
  MCP_INTERNAL_JWT_KEYS_FILE: /run/c2/jwks.json
  MCP_INTERNAL_JWT_ACTIVE_KID: stack-c2-1
  # Key of the tools/list cursor (HMAC, CC-181): a cursor issued by one instance must be read by the other.
  MCP_LIST_CURSOR_KEY: ${MCP_LIST_CURSOR_KEY:?run make secrets}

# Copy of docker-compose.m4.yml for the second broker (the M4 layer only knows the service mcp-credential-broker);
# scripts/check-compose.py compares the two brokers.
x-broker-m4-environment: &broker-m4-environment
  SPRING_PROFILES_ACTIVE: devstack
  MCP_ALLOW_TEST_KEYS: "true"
  BROKER_SYSTEMS_OPENSEARCH_BASEURL: http://opensearch.internal:8080
  BROKER_SYSTEMS_OPENSEARCH_ADAPTER: opensearch
  BROKER_SYSTEMS_OPENSEARCH_SUPPORTEDTYPES: token-exchange
  BROKER_SYSTEMS_OPENSEARCH_DEFAULTTYPE: token-exchange
  BROKER_SYSTEMS_OPENSEARCH_TOKENEXCHANGE_CLIENTID: mcp-credential-broker
  BROKER_SYSTEMS_OPENSEARCH_TOKENEXCHANGE_TOKENURL: http://keycloak:8080/realms/corp/protocol/openid-connect/token
  BROKER_SYSTEMS_OPENSEARCH_TOKENEXCHANGE_AUDIENCE: opensearch
  BROKER_SYSTEMS_OPENSEARCH_TOKENEXCHANGE_SCOPES: opensearch-audience
  BROKER_SYSTEMS_SERVICEDESK_BASEURL: http://servicedesk.internal:8080
  BROKER_SYSTEMS_SERVICEDESK_ADAPTER: generic-rest
  BROKER_SYSTEMS_SERVICEDESK_SUPPORTEDTYPES: service-account
  BROKER_SYSTEMS_SERVICEDESK_DEFAULTTYPE: service-account
  BROKER_SYSTEMS_SERVICEDESK_SECRETSCHEME: Bearer

networks:
  ci:
    name: ${COMPOSE_PROJECT_NAME:-mcp-dev}-ci

volumes:
  gateway-state-2:
  registry-data:

services:
  mcp-gateway:
    mem_limit: 2g
    environment: *gateway-m5-environment
    volumes:
      - ${C2_JWKS_FILE:-./.secrets/c2-jwks.json}:/run/c2/jwks.json:ro
    ports: !override
      - 127.0.0.1:${GATEWAY_1_PORT}:8080
    networks: !override
      core:
        aliases: [gateway-backends.internal]
      servers: {}

  mcp-gateway-2:
    extends:
      file: docker-compose.yml
      service: mcp-gateway
    mem_limit: 2g
    environment: *gateway-m5-environment
    volumes:
      - gateway-state-2:/app/state
      - ${C2_JWKS_FILE:-./.secrets/c2-jwks.json}:/run/c2/jwks.json:ro
    ports: !override
      - 127.0.0.1:${GATEWAY_2_PORT}:8080
    networks: !override
      core:
        aliases: [gateway-backends.internal]
      servers: {}
    # The first instance runs the Flyway migrations; the second one starts after it.
    depends_on:
      mcp-gateway: {condition: service_healthy}

  gateway-lb:
    profiles: [full]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./lb/gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      # The addresses the stack had before M5 (make m1 uses GATEWAY_PORT; the C5 listener is mTLS passthrough).
      - 127.0.0.1:${GATEWAY_PORT}:8080
      - 127.0.0.1:${GATEWAY_INTERNAL_PORT}:8443
      - 127.0.0.1:${LB_GATEWAY_STATUS_PORT}:8404
    networks:
      core:
        aliases: ["${MCP_GATEWAY_INTERNAL_TLS_NAME}"]
      servers:
        aliases: ["${MCP_GATEWAY_INTERNAL_TLS_NAME}"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/__lb/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  mcp-credential-broker:
    ports: !override
      - 127.0.0.1:${BROKER_1_PORT}:8443
    networks: !override
      core:
        aliases: [broker-backends.internal]

  mcp-credential-broker-2:
    extends:
      file: docker-compose.yml
      service: mcp-credential-broker
    environment: *broker-m4-environment
    ports: !override
      - 127.0.0.1:${BROKER_2_PORT}:8443
    networks: !override
      core:
        aliases: [broker-backends.internal]

  broker-lb:
    profiles: [full]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./lb/broker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:${BROKER_PORT}:8443
      - 127.0.0.1:${LB_BROKER_STATUS_PORT}:8404
    networks:
      core:
        aliases: ["${MCP_BROKER_TLS_NAME}"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/__lb/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Access log on stdout as the trace of a bundle download (X13 of mcp-e2e); the M4 file keeps `access_log off`.
  policies:
    volumes:
      - ./policies/nginx.m5.conf:/etc/nginx/nginx.conf:ro

  # MCP servers: limit and heap as for the gateway (their JVM sized itself from the whole Docker VM).
  mcp-jira:
    mem_limit: 2g
    environment: *jvm-limit-environment
  mcp-confluence:
    mem_limit: 2g
    environment: *jvm-limit-environment
  mcp-gitlab:
    mem_limit: 2g
    environment: *jvm-limit-environment
  mcp-servicedesk:
    mem_limit: 2g
    environment: *jvm-limit-environment
  mcp-opensearch:
    mem_limit: 2g
    environment: *jvm-limit-environment

  proxy:
    volumes:
      - ./proxy/m5/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/m5/routes.conf:/etc/nginx/routes.conf:ro
      - ./proxy/m5/to-gateway.conf:/etc/nginx/to-gateway.conf:ro

  # ---- D12: artifacts in dev. Start with `make m5-artifacts` (touches only these two services).

  packages:
    profiles: [ci]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./packages/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ARTIFACTS_DIR:-./artifacts}/packages:/srv/packages:ro
    ports:
      - 127.0.0.1:${PACKAGES_PORT}:8080
    networks:
      ci:
        aliases: [packages.internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 3s
      timeout: 3s
      retries: 20

  registry-data-init:
    profiles: [ci]
    image: python:3.12-alpine@sha256:0687a6bc9716edc2a6ee0fbfb0f87e7ee358b262b67c9215de91bc9b2d38ba71
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 65534:65534 /data && chmod 700 /data"]
    volumes:
      - registry-data:/data
    restart: "no"

  # Image registry (distribution). Plain http on loopback: Docker accepts localhost registries without TLS. No authentication,
  # so it is not published beyond 127.0.0.1 and not attached to the stack networks. Runs as nobody on a read-only root, deletion
  # through the API is off (images are removed by dropping the volume); the image is unchanged, only its settings are.
  registry:
    profiles: [ci]
    image: registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
    user: "65534:65534"
    read_only: true
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      # The image enables deletion in its own config; the setting is explicit so that an image cannot be removed over the API.
      REGISTRY_STORAGE_DELETE_ENABLED: "false"
    volumes:
      - registry-data:/var/lib/registry
    depends_on:
      registry-data-init: {condition: service_completed_successfully}
    ports:
      - 127.0.0.1:${REGISTRY_PORT}:5000
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks:
      ci:
        aliases: [registry.internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 3s
      timeout: 3s
      retries: 20
