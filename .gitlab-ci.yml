# Thin wrapper: all logic is in ci/run.sh (make ci runs the same steps). The runner supplies the CI image of ci/Dockerfile
# (default image of the runner, or the shell of the local runner of ci/local-runner.sh).
stages: [check]

static:
  stage: check
  script:
    - ci/run.sh lint unit compose style

docker-tests:
  stage: check
  variables:
    CI_REQUIRE_DOCKER: "1"
  script:
    - ci/run.sh proxy lb
